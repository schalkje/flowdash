<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>basic - node Demo</title>

    <!-- Standard CSS -->
    <link rel="stylesheet" href="../../dashboard/flowdash.css" />
    <link rel="stylesheet" href="../../dashboard/flowdash-demo.css" />

    <!-- Required Libraries -->
    <script src="../../dashboard/libs/d3.min.js"></script>
    <script src="../../dashboard/libs/d3-shape.min.js"></script>
    <script src="../../dashboard/libs/d3-dag.iife.min.js"></script>
    <script>
      window.FLOWDASH_THEME = { default: 'light' };
    </script>
    <script src="../../dashboard/js/themeManager.js"></script>
    <script defer src="/dashboard/demo-nav.js"></script>
  </head>

  <body>
    <!-- Demo Header -->
    <header class="demo-header">
      <h1>node Demos</h1>
      <h2>basic</h2>
      <p class="demo-description">Basic rectangular node with text display</p>

      <!-- Demo Controls -->
      <div class="demo-controls">
        <button id="updateBtn" onclick="updateDemo()">Update</button>
        <button id="resetBtn" onclick="resetDemo()">Reset</button>
        <button id="testBtn" onclick="runTests()">Run Tests</button>
      </div>
    </header>

    <!-- Demo Container -->
    <div class="demo-container">
      <svg id="graph" class="canvas"></svg>
    </div>

    <!-- Demo Information -->
    <footer class="demo-info">
      <div class="demo-metadata">
        <p><strong>Node Type:</strong> node</p>
        <p><strong>Features:</strong></p>
        <p><strong>Test Status:</strong> <span id="testStatus">Not Tested</span></p>
      </div>
    </footer>

    <script type="module">
      // Import demo data
      import { demoData } from './js/graphData.js';
      import flowDashboard from '../../dashboard/js/index.js';
      import { injectSettingsUI } from '../../dashboard/js/demoSettings.js';

      let flowdash;
      const baseData = demoData;

      function build(dataset) {
        if (!dataset) return;
        flowdash = new flowDashboard.Dashboard(dataset);
        flowdash.initialize('#graph');

        // Close loading popup after initialization
        if (flowdash.hideLoading && typeof flowdash.hideLoading === 'function') {
          flowdash.hideLoading();
        }

        window.flowdash = flowdash;

        // Attach dashboard instance to the graph element for settings to find
        const graphElement = document.getElementById('graph');
        if (graphElement) {
          graphElement.__dashboard__ = flowdash;
        }
      }

      injectSettingsUI({
        containerSelector: 'body',
        withVariation: false,
        getBaseData: () => baseData,
        buildDashboard: (dataset) => build(dataset),
        onDashboardRebuilt: (dashboardInstance) => {
          // This callback is called after the dashboard is rebuilt
          // We can use it to perform any post-rebuild operations
          if (
            dashboardInstance &&
            typeof dashboardInstance.updateStatusBasedCollapse === 'function'
          ) {
            dashboardInstance.updateStatusBasedCollapse();
          }
        },
      });

      build(baseData);

      // Attach data for debugging
      window.demoData = demoData;

      // Demo functions
      window.updateDemo = function () {
        // Implementation for update functionality
        console.log('Update demo called');
        // Toggle between different text lengths to show text centering
        const node = flowdash.main.root.getNode('node1');
        if (node) {
          const currentText = node.data.label;
          const newText =
            currentText === 'node Node' ? 'Very Long Text That Should Be Centered' : 'node Node';
          node.data.label = newText;
          node.update();
        }
      };

      window.resetDemo = function () {
        // Implementation for reset functionality
        flowdash.reset();
      };

      window.runTests = function () {
        // Implementation for running tests
        runDemoTests();
      };

      // Test runner
      function runDemoTests() {
        const testStatus = document.getElementById('testStatus');
        testStatus.textContent = 'Running...';

        // Basic validation tests
        const tests = [
          testDashboardInitialization,
          testNodeRendering,
          testDataStructure,
          testTextCentering,
          testNodePositioning,
        ];

        let passed = 0;
        let total = tests.length;

        tests.forEach((test) => {
          try {
            if (test()) passed++;
          } catch (e) {
            console.error('Test failed:', e);
          }
        });

        testStatus.textContent = `${passed}/${total} tests passed`;
        testStatus.className = passed === total ? 'test-pass' : 'test-fail';
      }

      // Test functions
      function testDashboardInitialization() {
        return flowdash && typeof flowdash.initialize === 'function';
      }

      function testNodeRendering() {
        const nodes = document.querySelectorAll('.node');
        return nodes.length > 0;
      }

      function testDataStructure() {
        return demoData && demoData.nodes && Array.isArray(demoData.nodes);
      }

      function testTextCentering() {
        const node = flowdash.main.root.getNode('node1');
        if (!node) return false;

        // Check if text is properly centered
        const textElement = document.querySelector('.node text');
        if (!textElement) return false;

        const textAnchor = textElement.getAttribute('text-anchor');
        const dominantBaseline = textElement.getAttribute('dominant-baseline');

        return textAnchor === 'middle' && dominantBaseline === 'middle';
      }

      function testNodePositioning() {
        const node = flowdash.main.root.getNode('node1');
        return node && typeof node.x === 'number' && typeof node.y === 'number';
      }
    </script>
  </body>
</html>
