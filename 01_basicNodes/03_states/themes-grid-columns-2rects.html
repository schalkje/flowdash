<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>states – themes grid (columns, 2 rects)</title>

    <style>
      :root { --card-w: 250px; --card-h: 400px; }
      body {
        margin: 0;
        font-family: system-ui, Segoe UI, Arial, sans-serif;
        background: #f5f6f8;
        color: #222;
      }
      header { padding: 16px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { margin: 0; color: #555; }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(var(--card-w), 1fr));
        gap: 12px;
        padding: 12px 16px 24px;
      }

      .card {
        width: var(--card-w);
        height: var(--card-h);
        border: 1px solid #ddd;
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        margin: 0 auto;
      }

      .card h3 {
        margin: 0;
        padding: 8px 10px;
        font-size: 13px;
        font-weight: 600;
        background: #fafafa;
        border-bottom: 1px solid #eee;
        text-transform: capitalize;
      }

      .card iframe {
        border: 0;
        width: 100%;
        height: 100%;
        flex: 1 1 auto;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>states – themes grid (columns, 2 rects)</h1>
      <p>Single columns container with two rectangular children.</p>
      <p><button id="toggle-all" type="button">Collapse all</button></p>
    </header>

    <section id="grid" class="grid" aria-label="Themes Grid"></section>

    <script type="module">
      import { setupThemesGrid } from './js/themes-grid.runtime.js';
      setupThemesGrid({ dataFile: './js/graphData.columns-2rects.js' });
    </script>
  </body>
</html>
