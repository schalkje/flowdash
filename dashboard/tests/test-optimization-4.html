<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Optimization #4 - Cache Node Lookups for Edges</title>
    <script src="../libs/d3.min.js"></script>
    <script src="../libs/d3-shape.min.js"></script>
    <script src="../libs/d3-dag.iife.min.js"></script>
    <link rel="stylesheet" href="../flowdash.css">
    <script>window.FLOWDASH_THEME = { default: 'light' };</script>
    <script src="../js/themeManager.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 1400px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 {
            margin: 0 0 10px 0;
            font-size: 2em;
        }
        .header p {
            margin: 0;
            opacity: 0.9;
            font-size: 1.1em;
        }
        .controls {
            padding: 20px 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        select {
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 6px;
            font-size: 14px;
            min-width: 200px;
            cursor: pointer;
        }
        #graph {
            width: 100%;
            height: 600px;
            background: white;
        }
        .metrics {
            padding: 30px;
            background: #f8f9fa;
        }
        .metrics h2 {
            margin: 0 0 20px 0;
            color: #333;
        }
        .metric-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .metric-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .metric-card h3 {
            margin: 0 0 10px 0;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666;
        }
        .metric-value {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }
        .metric-unit {
            font-size: 0.5em;
            color: #999;
            margin-left: 5px;
        }
        .phase-table {
            width: 100%;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .phase-table table {
            width: 100%;
            border-collapse: collapse;
        }
        .phase-table th,
        .phase-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e9ecef;
        }
        .phase-table th {
            background: #667eea;
            color: white;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85em;
            letter-spacing: 1px;
        }
        .phase-table tr:hover {
            background: #f8f9fa;
        }
        .improvement {
            color: #28a745;
            font-weight: bold;
        }
        .status {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: 600;
        }
        .status-pass {
            background: #d4edda;
            color: #155724;
        }
        .status-fail {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Optimization #4 Test</h1>
            <p>Cache Node Lookups for Edges - Performance Verification</p>
        </div>

        <div class="controls">
            <select id="fileSelector">
                <option value="dwh-1.json">dwh-1.json (4 nodes) - Small</option>
                <option value="dwh-5.json">dwh-5.json (21 nodes) - Medium</option>
                <option value="theme_1.json">theme_1.json (52 nodes) - Medium+</option>
                <option value="theme_2.json">theme_2.json (875 nodes) - Large</option>
                <option value="dwh-6.fixed.json" selected>dwh-6.fixed.json (885 nodes) - Target</option>
            </select>
            <button class="btn btn-primary" onclick="loadDashboard()">📊 Load Dashboard</button>
            <button class="btn btn-primary" onclick="showMetrics()">📈 Show Metrics</button>
        </div>

        <div id="graph"></div>

        <div class="metrics" id="metricsPanel" style="display: none;">
            <h2>📊 Performance Metrics</h2>
            <div class="metric-grid">
                <div class="metric-card">
                    <h3>Total Load Time</h3>
                    <div class="metric-value" id="totalTime">-<span class="metric-unit">ms</span></div>
                </div>
                <div class="metric-card">
                    <h3>Edge Creation Time</h3>
                    <div class="metric-value" id="edgeTime">-<span class="metric-unit">ms</span></div>
                </div>
                <div class="metric-card">
                    <h3>Total Nodes</h3>
                    <div class="metric-value" id="totalNodes">-</div>
                </div>
                <div class="metric-card">
                    <h3>Total Edges</h3>
                    <div class="metric-value" id="totalEdges">-</div>
                </div>
            </div>

            <div class="phase-table">
                <table>
                    <thead>
                        <tr>
                            <th>Phase</th>
                            <th>Time (ms)</th>
                            <th>Percentage</th>
                        </tr>
                    </thead>
                    <tbody id="phaseTableBody">
                        <!-- Populated by JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { loadDashboardFromFile } from '../js/dashboard.js';

        let currentDashboard = null;

        window.loadDashboard = async function() {
            const selector = document.getElementById('fileSelector');
            const filename = selector.value;
            
            console.log(`📂 Loading ${filename}...`);
            
            try {
                // Clear and prepare graph container
                const graphContainer = document.getElementById('graph');
                graphContainer.innerHTML = '';
                
                // Create SVG element for dashboard
                d3.select('#graph')
                    .append('svg')
                    .attr('width', '100%')
                    .attr('height', '100%')
                    .style('display', 'block');
                
                currentDashboard = await loadDashboardFromFile('#graph svg', filename);
                console.log('✅ Dashboard loaded successfully');
                
                // Show metrics after a short delay to ensure everything is rendered
                setTimeout(() => {
                    showMetrics();
                }, 500);
            } catch (error) {
                console.error('❌ Error loading dashboard:', error);
                alert('Failed to load dashboard: ' + error.message);
            }
        };

        window.showMetrics = function() {
            if (!currentDashboard) {
                alert('Please load a dashboard first!');
                return;
            }

            const metrics = currentDashboard.performanceMetrics;
            const metricsPanel = document.getElementById('metricsPanel');
            
            // Update metric cards
            document.getElementById('totalTime').innerHTML = 
                metrics.phases.total.toFixed(2) + '<span class="metric-unit">ms</span>';
            document.getElementById('edgeTime').innerHTML = 
                metrics.phases.edgeCreation.toFixed(2) + '<span class="metric-unit">ms</span>';
            document.getElementById('totalNodes').textContent = 
                metrics.nodeStats.totalNodes;
            document.getElementById('totalEdges').textContent = 
                currentDashboard.data.edges?.length || 0;

            // Update phase table
            const tbody = document.getElementById('phaseTableBody');
            tbody.innerHTML = '';
            
            const phases = metrics.phases;
            const total = phases.total;
            
            Object.entries(phases).forEach(([phase, time]) => {
                if (phase === 'total') return;
                
                const percentage = ((time / total) * 100).toFixed(1);
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${phase}</td>
                    <td>${time.toFixed(2)}</td>
                    <td>${percentage}%</td>
                `;
                tbody.appendChild(row);
            });

            // Add total row
            const totalRow = document.createElement('tr');
            totalRow.style.fontWeight = 'bold';
            totalRow.style.background = '#f8f9fa';
            totalRow.innerHTML = `
                <td>TOTAL</td>
                <td>${total.toFixed(2)}</td>
                <td>100%</td>
            `;
            tbody.appendChild(totalRow);

            // Show the panel
            metricsPanel.style.display = 'block';
            
            // Scroll to metrics
            metricsPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
        };

        // Auto-load on page load
        window.addEventListener('load', () => {
            console.log('🎯 Optimization #4 Test Page Loaded');
            console.log('💡 Click "Load Dashboard" to test the cached node lookup optimization');
        });
    </script>
</body>
</html>
