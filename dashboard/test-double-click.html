<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Double-Click Test</title>
    <link rel="stylesheet" href="flowdash.css">
    <link rel="stylesheet" href="flowdash-demo.css">
</head>
<body>
    <div id="dashboard"></div>
    
    <script src="libs/d3.min.js"></script>
    <script src="libs/d3-shape.min.js"></script>
    <script src="libs/d3-dag.iife.min.js"></script>
    <script src="js/themeManager.js"></script>
    <script src="js/nodeBase.js"></script>
    <script src="js/index.js"></script>
    <script src="js/utilPath.js"></script>
    <script src="js/eventManager.js"></script>
    <script src="js/statusManager.js"></script>
    <script src="js/configManager.js"></script>
    <script src="js/zones/index.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/data.js"></script>
    <script src="js/loadingOverlay.js"></script>
    <script src="js/zones/ZoneManager.js"></script>
    <script src="js/node.js"></script>
    <script src="js/nodeRegistry.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/markers.js"></script>
    <script src="js/edge.js"></script>
    <script src="js/minimap.js"></script>
    <script src="js/zoomManager.js"></script>
    <script src="js/nodeAdapter.js"></script>
    <script src="js/nodeGroup.js"></script>
    <script src="js/nodeFoundation.js"></script>
    <script src="js/nodeMart.js"></script>
    <script src="js/nodeLane.js"></script>
    <script src="js/nodeColumns.js"></script>
    <script src="js/nodeRect.js"></script>
    <script src="js/nodeCircle.js"></script>
    <script src="js/nodeEdgeDemo.js"></script>
    <script src="js/edgeBase.js"></script>
    <script src="js/nodeBaseContainer.js"></script>
    <script src="js/simulation.js"></script>
    <script src="js/layoutManager.js"></script>
    <script src="js/forceRectCollide.js"></script>
    <script src="js/geometryManager.js"></script>
    <script src="js/zones/BaseZone.js"></script>
    <script src="js/zones/ContainerZone.js"></script>
    <script src="js/zones/HeaderZone.js"></script>
    <script src="js/zones/MarginZone.js"></script>
    <script src="js/zones/InnerContainerZone.js"></script>
    
    <script>
        // Test the double-click functionality
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Testing double-click functionality...');
            
            // Wait for dashboard to load
            setTimeout(() => {
                const dashboard = window.dashboard;
                if (dashboard) {
                    console.log('Dashboard loaded, testing zones...');
                    
                    // Test that zones have event handlers
                    const zones = document.querySelectorAll('g[class*="zone-"]');
                    console.log(`Found ${zones.length} zones`);
                    
                    zones.forEach((zone, index) => {
                        console.log(`Zone ${index}: ${zone.className}`);
                        
                        // Check if zone has __node property
                        if (zone.__node) {
                            console.log(`  - Has __node property: ${zone.__node.constructor.name}`);
                        } else {
                            console.log(`  - Missing __node property`);
                        }
                        
                        // Check for D3 event handlers
                        const d3Data = zone.__data__;
                        if (d3Data && d3Data.on) {
                            console.log(`  - Has D3 event handlers:`, Object.keys(d3Data.on));
                        } else {
                            console.log(`  - No D3 event handlers found`);
                        }
                    });
                } else {
                    console.error('Dashboard not loaded');
                }
            }, 3000);
        });
    </script>
</body>
</html>
