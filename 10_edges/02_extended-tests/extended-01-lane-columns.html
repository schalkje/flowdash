<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Extended 01 - Lane ↔ Columns</title>

    <link rel="stylesheet" href="../../dashboard/flowdash.css" />
    <link rel="stylesheet" href="../../dashboard/flowdash-demo.css" />

    <script src="../../dashboard/libs/d3.min.js"></script>
    <script src="../../dashboard/libs/d3-shape.min.js"></script>
    <script src="../../dashboard/libs/d3-dag.iife.min.js"></script>
    <script>
      window.FLOWDASH_THEME = { default: 'light' };
    </script>
    <script src="../../dashboard/js/themeManager.js"></script>
    <script defer src="/dashboard/demo-nav.js"></script>
  </head>
  <body>
    <header class="demo-header">
      <h1>Edges – Extended</h1>
      <h2>01 - Lane ↔ Columns</h2>
      <div class="demo-controls">
        <button id="collapseLane">Collapse Lane</button>
        <button id="expandLane">Expand Lane</button>
        <button id="collapseCols">Collapse Columns</button>
        <button id="expandCols">Expand Columns</button>
      </div>
    </header>

    <div class="demo-container">
      <svg id="graph" class="canvas"></svg>
    </div>

    <script type="module">
      import { demoData } from './js/extended-01.js';
      import flowDashboard from '../../dashboard/js/index.js';
      import { injectSettingsUI } from '../../dashboard/js/demoSettings.js';

      let flowdash;
      function build(dataset) {
        const ds = dataset || demoData;
        flowdash = new flowDashboard.Dashboard(ds);
        flowdash.initialize('#graph');
        window.flowdash = flowdash;
      }

      injectSettingsUI({
        containerSelector: 'body',
        withVariation: false,
        getBaseData: () => demoData,
        buildDashboard: (dataset) => build(dataset),
      });

      build(demoData);

      function getNode(id) {
        return flowdash?.main?.root?.getNode(id);
      }
      document
        .getElementById('collapseLane')
        .addEventListener('click', () => getNode('laneA')?.collapse());
      document
        .getElementById('expandLane')
        .addEventListener('click', () => getNode('laneA')?.expand());
      document
        .getElementById('collapseCols')
        .addEventListener('click', () => getNode('colsB')?.collapse());
      document
        .getElementById('expandCols')
        .addEventListener('click', () => getNode('colsB')?.expand());
    </script>
  </body>
</html>
