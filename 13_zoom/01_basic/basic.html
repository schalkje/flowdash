<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Zoom — basic</title>
    <link rel="stylesheet" href="../../dashboard/flowdash.css" />
    <link rel="stylesheet" href="../../dashboard/flowdash-demo.css" />
    <script src="../../dashboard/libs/d3.min.js"></script>
    <script src="../../dashboard/libs/d3-shape.min.js"></script>
    <script src="../../dashboard/libs/d3-dag.iife.min.js"></script>
    <script>
      window.FLOWDASH_THEME = { default: 'light' };
    </script>
    <script src="../../dashboard/js/themeManager.js"></script>
    <style>
      .zoom-info {
        font-size: 13px;
        padding: 6px 12px;
        background: #f8f8f8;
        border-bottom: 1px solid #ddd;
      }
      .zoom-info code {
        background: #eee;
        padding: 1px 4px;
        border-radius: 3px;
      }
      .demo-controls {
        gap: 6px;
        flex-wrap: wrap;
      }
    </style>
    <script defer src="/dashboard/demo-nav.js"></script>
  </head>
  <body>
    <header class="demo-header">
      <h1>Zoom</h1>
      <h2>basic</h2>
      <p class="demo-description">
        Try mouse-wheel zoom, drag-to-pan, double-click to auto-zoom on a node, or use the explicit
        buttons below.
      </p>
      <div class="demo-controls">
        <button id="zoomInBtn">Zoom in</button>
        <button id="zoomOutBtn">Zoom out</button>
        <button id="resetBtn">Reset (zoom to root)</button>
        <button id="fitBtn">Fit to viewport</button>
      </div>
    </header>
    <div class="zoom-info">Current scale: <code id="scaleVal">1.00</code></div>
    <div class="demo-container">
      <svg id="graph" class="canvas"></svg>
    </div>
    <footer class="demo-info">
      <div class="demo-metadata">
        <p><strong>Settings:</strong> <code>zoom.scaleExtent</code>, <code>zoomToRoot</code></p>
        <p>
          <strong>API:</strong> <code>dashboard.zoomManager</code>, <code>dashboard.main.zoom</code>
        </p>
      </div>
    </footer>
    <script type="module">
      import { demoData } from './js/graphData.js';
      import flowDashboard from '../../dashboard/js/index.js';

      const dashboard = new flowDashboard.Dashboard(demoData);
      dashboard.initialize('#graph');
      window.dashboard = dashboard;

      const scaleVal = document.getElementById('scaleVal');
      function updateScale() {
        const t = d3.zoomTransform(d3.select('#graph').node());
        scaleVal.textContent = t.k.toFixed(2);
      }
      d3.select('#graph').on('zoom.demo', updateScale).on('end.demo', updateScale);
      setInterval(updateScale, 250);

      document.getElementById('zoomInBtn').onclick = () => dashboard.zoomManager?.zoomIn?.();
      document.getElementById('zoomOutBtn').onclick = () => dashboard.zoomManager?.zoomOut?.();
      document.getElementById('resetBtn').onclick = () => dashboard.zoomManager?.zoomToRoot?.();
      document.getElementById('fitBtn').onclick = () => dashboard.zoomManager?.fitToViewport?.();
    </script>
  </body>
</html>
